server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API + SSE (eventos de run en streaming): sin buffering ni caché,
    # y read-timeout alto porque los streams de run duran minutos.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        client_max_body_size 50m;
    }

    # SPA: cualquier ruta devuelve index.html (no hay router en el front).
    location / {
        try_files $uri /index.html;
    }
}
